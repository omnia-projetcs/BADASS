name: Benchmark regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate metadata and required entry points
        run: python3 tools/lab.py validate
      - name: Tooling, property and mutation tests
        run: python3 -m unittest discover -s tests -v
      - name: Nonempty smoke gate
        run: python3 tools/smoke.py --output reports/smoke.json

  isolated-full-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build all language runtimes
        run: make container-build
      - name: Run every case with no external network
        run: make container-test
